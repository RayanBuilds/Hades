name: hades
description: "Hades — a customizable YouTube Music client for Android, built by ItzFallenMe."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  audio_session: ^0.2.4
  cached_network_image: ^4.0.3
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  http: ^1.6.0
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  palette_generator: ^0.3.3+7
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0C0806"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 23
